plugins {
    id 'com.android.application'
}

android {
    namespace 'com.netprobe'
    compileSdk 36

    defaultConfig {
        applicationId "com.netprobe"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file('C:/apps/access_app/android/app/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
