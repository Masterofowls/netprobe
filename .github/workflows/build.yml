name: Build & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  publish-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@masterofowls'

      - name: Install dependencies
        run: npm ci

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK
        run: cd android && ./gradlew assembleRelease

      - name: Build AAB
        run: cd android && ./gradlew bundleRelease

      - name: Prepare release artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp android/app/build/outputs/apk/release/app-release.apk "NetProbe-v${VERSION}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "NetProbe-v${VERSION}.aab"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetProbe-release-apk
          path: NetProbe-v*.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetProbe-release-aab
          path: NetProbe-v*.aab

      - name: Create release if missing
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "${{ github.ref_name }}" \
            --title "NetProbe v${VERSION}" \
            --notes "## NetProbe v${VERSION}

          Real-time network resource connectivity tester for Android.

          ### Install via Komi Store
          Search for **NetProbe** in [Komi Store](https://komistore.app/) or open this repo URL in the app.

          ### Direct download
          - **NetProbe-v${VERSION}.apk** — Android installer (sideload / Komi Store)
          - **NetProbe-v${VERSION}.aab** — Google Play bundle" \
            --generate-notes \
            || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach APK and AAB to release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release upload "${{ github.ref_name }}" \
            NetProbe-v*.apk \
            NetProbe-v*.aab \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
